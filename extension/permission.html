<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Microphone Access - WebMCP Extension</title>
  <style>
    :root {
      --color-primary: #0b57d0;
      --color-primary-hover: #0842a0;
      --color-primary-container: #d3e3fd;
      --color-blue-title: #001944;
      --color-surface: #ffffff;
      --color-surface-container: #f0f4f9;
      --color-on-surface: #1b1c1d;
      --color-on-surface-variant: #444746;
      --color-outline: #e1e3e1;
      --color-error: #b3261e;
      --color-error-container: #f9dedc;
      --color-success: #146c2e;
      --color-success-container: #c4eed0;
      --font-body: 'Google Sans Text', -apple-system, BlinkMacSystemFont, sans-serif;
      --font-headline: 'Google Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: var(--font-body);
      background: var(--color-surface-container);
      color: var(--color-on-surface);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-outline);
      border-radius: 12px;
      padding: 32px 28px;
      max-width: 420px;
      width: 100%;
      text-align: center;
    }
    .icon-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 999px;
      background: var(--color-primary-container);
      color: var(--color-primary);
      margin-bottom: 16px;
    }
    h1 {
      font-family: var(--font-headline);
      font-size: 20px;
      font-weight: 600;
      line-height: 28px;
      color: var(--color-blue-title);
      margin-bottom: 8px;
    }
    p {
      color: var(--color-on-surface-variant);
      font-size: 14px;
      line-height: 20px;
      margin-bottom: 20px;
    }
    .status {
      display: inline-block;
      font-size: 12px;
      line-height: 16px;
      padding: 6px 14px;
      border-radius: 999px;
      background: var(--color-primary-container);
      color: var(--color-primary);
      margin-bottom: 20px;
      font-weight: 500;
    }
    .status[data-state="granted"] {
      background: var(--color-success-container);
      color: var(--color-success);
    }
    .status[data-state="denied"] {
      background: var(--color-error-container);
      color: var(--color-error);
    }
    button {
      background: var(--color-primary);
      color: #ffffff;
      border: none;
      padding: 10px 24px;
      font-family: var(--font-body);
      font-size: 13px;
      font-weight: 500;
      border-radius: 999px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }
    button:hover {
      background: var(--color-primary-hover);
    }
    button:focus-visible {
      outline: 2px solid var(--color-primary);
      outline-offset: 2px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon-wrap" aria-hidden="true">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5.91-3c-.49 0-.9.36-.98.85C16.52 14.2 14.47 16 12 16s-4.52-1.8-4.93-4.15a.998.998 0 0 0-.98-.85c-.61 0-1.09.54-1 1.14.49 3 2.89 5.35 5.91 5.78V20c0 .55.45 1 1 1s1-.45 1-1v-2.08c3.02-.43 5.42-2.78 5.91-5.78.1-.6-.39-1.14-1-1.14z"/>
      </svg>
    </div>
    <h1>Microphone Permission</h1>
    <p>Select <strong>Allow</strong> in the browser prompt above to enable Gemini Live Voice Mode.</p>
    <div id="status" class="status" data-state="pending">Waiting for permission...</div>
    <div>
      <button id="request-btn" type="button">Prompt Again</button>
    </div>
  </div>
  <script src="permission.js"></script>
</body>
</html>
