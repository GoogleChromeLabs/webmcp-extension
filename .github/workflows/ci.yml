name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # tsc only covers src, tests and extension typings, so nothing above
      # would catch a syntax error in the server or the build script.
      - run: npm run check:syntax

      - run: npm test

      # The build generates a throwaway auth token into .env when one is
      # missing, so this only proves the bundle compiles. Nothing here is a
      # real credential and nothing is uploaded.
      - run: npm run build
