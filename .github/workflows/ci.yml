name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # tsc only covers src, tests and extension typings, so nothing above
      # would catch a syntax error in the server or the build script.
      - run: npm run check:syntax

      # The build generates a throwaway auth token into .env when one is
      # missing, so this proves the extension bundle compiles cleanly before
      # running unit and Chrome MV3 smoke tests. Nothing here is a real
      # credential and nothing is uploaded.
      - run: npm run build

      # https://developer.chrome.com/docs/automation-and-testing/download-test-binaries#download_using_npm
      # @puppeteer/browsers is a devDependency, so npx runs the locked version.
      - name: Install Chrome for Testing for MV3 extension smoke tests
        run: |
          CHROME_BIN=$(npx @puppeteer/browsers install chrome@stable --path "$RUNNER_TEMP/chrome" --format '{{path}}')
          "$CHROME_BIN" --version
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - run: npm test
