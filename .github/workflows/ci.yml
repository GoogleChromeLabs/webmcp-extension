name: CI

"on":
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel an in-progress run when the same branch is pushed again.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      # tsc only covers src, tests and extension typings, so nothing above
      # would catch a syntax error in the server or the build script.
      - run: npm run check:syntax

      # The build generates a throwaway auth token into .env when one is
      # missing, so this proves the extension bundle compiles cleanly before
      # running unit and Chrome MV3 smoke tests. Nothing here is a real
      # credential and nothing is uploaded.
      - run: npm run build

      - name: Set up Chrome for Testing for MV3 extension smoke tests
        run: |
          CFT_URL=$(node -e '
            fetch("https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json")
              .then(r => r.json())
              .then(d => console.log(d.channels.Stable.downloads.chrome.find(x => x.platform === "linux64").url));
          ')
          curl -fsSL "$CFT_URL" -o /tmp/chrome-linux64.zip
          unzip -q /tmp/chrome-linux64.zip -d /tmp
          /tmp/chrome-linux64/chrome --version
          echo "CHROME_BIN=/tmp/chrome-linux64/chrome" >> "$GITHUB_ENV"

      - run: npm test
